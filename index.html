<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conkey — Consistency is the Key.">
    <title>Conkey — Consistency is the Key</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <h2 class="gradient-text logo">CONKEY</h2>
            <nav class="nav-links">
                <a href="#" class="nav-item active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-item"><i data-lucide="check-square"></i> Habits</a>
                <a href="#" class="nav-item"><i data-lucide="trophy"></i> Achievements</a>
                <a href="#" class="nav-item"><i data-lucide="user"></i> Profile</a>
                <a href="#" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <div class="main-frame">
            
            <header class="app-header">
                <div class="user-profile">
                    <div class="user-avatar" id="avatar-fallback">A</div>
                    <div>
                        <p class="profile-name" id="user-name">Loading...</p>
                        <p class="profile-meta" id="user-level">Level -- Scholar</p>
                    </div>
                </div>
                <button class="btn-icon" title="Log Out"><i data-lucide="log-out"></i></button>
            </header>

            <main class="content-body animate-fade-in">
                
                <div class="welcome-row">
                    <h1 class="section-title" id="welcome-msg">Welcome back! 👋</h1>
                    <p class="section-subtitle">Keep up your daily streaks and build unbreakable consistency.</p>
                </div>

                <div class="stats-grid">
                    <div class="glass-card stat-card">
                        <div class="icon-wrap warning"><i data-lucide="flame"></i></div>
                        <div>
                            <p class="stat-label">Current Streak</p>
                            <h3 class="stat-value" id="streak-val">-- Days</h3>
                        </div>
                    </div>

                    <div class="glass-card stat-card full-w">
                        <div class="icon-wrap primary"><i data-lucide="star"></i></div>
                        <div style="flex: 1;">
                            <p class="stat-label">Level Progress</p>
                            <h3 class="stat-subvalue" id="xp-val">-- / -- XP</h3>
                            <div class="progress-bar"><div class="progress-bar-fill" id="xp-bar" style="width: 0%"></div></div>
                        </div>
                    </div>
                </div>

                <div class="glass-card checklist-panel">
                    <h3 class="panel-heading">Today's Habits Tracker</h3>
                    <div class="habits-list" id="habits-container">
                        </div>
                </div>

            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
